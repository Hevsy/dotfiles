[general]
import = [
    "~/.config/alacritty/themes/themes/smoooooth.toml"
]

[window]
# Options: "Windowed", "Maximized", "Fullscreen"
startup_mode = "Maximized"

[font]
size = 9.5

# This tweaks character spacing to force full-bleed glyph alignment
[font.offset]
x = 0
y = 0

# Glyph offset moves ONLY the letters/symbols within their pixel tracks.
# A negative y value pulls the shapes downward.
[font.glyph_offset]
x = 0
y = 0

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"
