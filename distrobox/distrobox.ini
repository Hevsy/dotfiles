# Distrobox assemble file for the "dev" container.
# Create/recreate with: bootstrap-host.sh (sets EXTRA_PACKAGES and HOST_UID,
# then runs `distrobox assemble create -f distrobox.ini`).
#
# distrobox runs this file through envsubst, so ${EXTRA_PACKAGES} and
# ${HOST_UID} below are expanded from the environment at creation time.

[dev]
image=registry.fedoraproject.org/fedora-toolbox:41
pull=true
start_now=false
# Base OS + homebrew bootstrap packages only. Every actual CLI tool
# (kubectl, helm, tenv, aws-cli, krew, lazygit, uv, opencode...) comes from
# the shared Homebrew install (~/.homebrew) via ../Brewfile, installed by
# distrobox/post-create.sh. See packages-dnf.txt for what's left and why.
additional_packages="${EXTRA_PACKAGES}"
# Share the host's rootless podman socket so `docker`/`podman` build/push
# commands run from inside the container hit the host's engine instead of
# nesting a container runtime inside the container.
volume=/run/user/${HOST_UID}/podman/podman.sock:/run/user/${HOST_UID}/podman/podman.sock:rw
