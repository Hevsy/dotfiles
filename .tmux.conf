# ==========================================
# TERMINAL & COLOR SETTINGS
# ==========================================
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",alacritty:Tc"
set -as terminal-overrides ",xterm-256color*:Tc"

# Configure status line position
set -g status-position top

# ==========================================
# PREFIX & CORE CONFIG
# ==========================================
# Use backtick (`) as the main prefix
set-option -g prefix `
unbind-key C-b
bind-key ` last-window
bind-key a send-prefix

# F11/F12 emergency safety toggle for the prefix
bind-key F11 set-option -g prefix C-a
bind-key F12 set-option -g prefix `

# Quality of Life settings
set -g renumber-window on
set -g set-clipboard on
setw -g mode-keys vi
set -s exit-empty off
set -g mouse on

# Start counting pane and window numbers at 1
set -g base-index 1
setw -g pane-base-index 1

# ==========================================
# KEYBINDINGS (Navigation & Splits)
# ==========================================
bind H previous-window
bind L next-window
bind w list-windows
bind | split-window
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind \\ set-window-option synchronize-panes

# ==========================================
# CATPPUCCIN THEME (v2 Syntax)
# ==========================================
set -g @catppuccin_flavor 'frappe' 

# Set the window tabs (left) to slanted
set -g @catppuccin_window_status_style "slanted"

# Force the status modules (right) to match the slanted style
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_status_connect_separator "no"

# Window text formats
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"

# ==========================================
# PLUGINS (TPM)
# ==========================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugin options
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '20'
set -g @continuum-restore 'on'

# ==========================================
# STATUS LINE INITIALIZATION (Required for v2)
# ==========================================
set -g status-left "#{E:@catppuccin_status_session} "
set -g status-right "#{E:@catppuccin_status_session} #{E:@catppuccin_status_directory} #{E:@catppuccin_status_date_time}"

# Initialize TMUX plugin manager (Keep this at the very bottom!)
run '~/.tmux/plugins/tpm/tpm'
